<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src http://127.0.0.1:* ws://127.0.0.1:*;" />
<title>Jarvis</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: #121826;
    --panel-2: #182031;
    --line: #222d42;
    --text: #e6ecf7;
    --muted: #8494b0;
    --accent: #35d6ff;
    --accent-dim: #1b7f99;
    --warn: #ffb340;
    --danger: #ff5f6d;
    --ok: #4ade80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    /* A faint glow anchors the orb without needing an image asset. */
    background:
      radial-gradient(120% 70% at 50% -10%, #16324a 0%, transparent 60%),
      var(--bg);
  }

  /* ---- title bar ---- */
  header {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .brand { font-weight: 600; letter-spacing: .14em; font-size: 11px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.ready { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.failed { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  .dot.starting { background: var(--warn); animation: blink 1.1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .spacer { flex: 1; }
  header button {
    -webkit-app-region: no-drag;
    background: none; border: 0; color: var(--muted);
    width: 26px; height: 24px; border-radius: 6px; cursor: pointer;
    font-size: 13px; line-height: 1;
  }
  header button:hover { background: var(--panel-2); color: var(--text); }
  header button.on { color: var(--accent); }

  /* ---- orb ---- */
  .stage {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 0 10px;
  }
  .orb {
    width: 76px; height: 76px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2b3d58, #101726 70%);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    position: relative; cursor: pointer;
    -webkit-app-region: no-drag;
    transition: box-shadow .25s, border-color .25s;
  }
  .orb::after {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 1px solid transparent; transition: border-color .25s;
  }
  .orb .core {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--muted); transition: background .25s, transform .25s;
  }
  body[data-state="listening"] .orb { border-color: var(--accent); box-shadow: 0 0 26px -4px var(--accent); }
  body[data-state="listening"] .orb .core { background: var(--accent); }
  body[data-state="listening"] .orb::after { border-color: var(--accent-dim); animation: ripple 1.4s ease-out infinite; }
  body[data-state="thinking"] .orb .core { background: var(--warn); animation: pulse .9s ease-in-out infinite; }
  body[data-state="acting"] .orb .core { background: var(--warn); }
  body[data-state="speaking"] .orb { border-color: var(--ok); box-shadow: 0 0 26px -6px var(--ok); }
  body[data-state="speaking"] .orb .core { background: var(--ok); animation: pulse .7s ease-in-out infinite; }
  body[data-state="confirming"] .orb { border-color: var(--warn); box-shadow: 0 0 26px -4px var(--warn); }
  body[data-state="confirming"] .orb .core { background: var(--warn); animation: blink .8s infinite; }
  body[data-state="error"] .orb .core { background: var(--danger); }
  @keyframes ripple { from { transform: scale(1); opacity: .9; } to { transform: scale(1.45); opacity: 0; } }
  @keyframes pulse { 50% { transform: scale(1.28); } }

  .state-label {
    margin-top: 9px; font-size: 10.5px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--muted); min-height: 15px;
  }

  .meter {
    margin-top: 8px; width: 150px; height: 3px; border-radius: 2px;
    background: var(--panel-2); overflow: hidden;
  }
  .meter i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    transition: width .08s linear;
  }

  /* ---- tabs ---- */
  nav {
    display: flex; gap: 2px; padding: 0 10px; flex: 0 0 auto;
    border-bottom: 1px solid var(--line);
  }
  nav button {
    background: none; border: 0; color: var(--muted); cursor: pointer;
    padding: 7px 11px; font-size: 11.5px; border-bottom: 2px solid transparent;
  }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  nav button:hover { color: var(--text); }

  main { flex: 1 1 auto; overflow-y: auto; padding: 10px 12px; user-select: text; }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ---- transcript ---- */
  .msg { margin-bottom: 9px; display: flex; gap: 8px; align-items: flex-start; }
  .msg .who {
    flex: 0 0 auto; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); width: 40px; padding-top: 3px;
  }
  .msg .body {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 10px; word-break: break-word;
  }
  .msg.you .body { background: var(--panel-2); }
  .msg.jarvis .body { border-color: #1d3a4a; }
  .msg .lang {
    font-size: 9.5px; color: var(--muted); margin-left: 6px; letter-spacing: .06em;
  }
  .msg.action .body { border-color: var(--accent-dim); color: var(--accent); font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
  .msg.error .body { border-color: var(--danger); color: #ffc3c8; }
  .msg.confirm .body { border-color: var(--warn); color: #ffd79a; }

  .empty { color: var(--muted); text-align: center; padding: 26px 10px; font-size: 12px; }
  .empty kbd {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px;
    padding: 1px 5px; font-family: inherit; font-size: 11px; color: var(--text);
  }

  /* ---- skills ---- */
  .cat { margin-bottom: 12px; }
  .cat h3 {
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 5px;
  }
  .skill {
    display: flex; gap: 7px; align-items: baseline;
    padding: 4px 7px; border-radius: 6px; cursor: pointer;
  }
  .skill:hover { background: var(--panel); }
  .skill .ex { color: var(--muted); font-size: 11.5px; }
  .risk { font-size: 9px; padding: 1px 5px; border-radius: 4px; flex: 0 0 auto; }
  .risk.safe { background: #17301f; color: var(--ok); }
  .risk.confirm { background: #33290f; color: var(--warn); }
  .risk.critical { background: #35161a; color: var(--danger); }

  /* ---- activity ---- */
  .row {
    display: flex; gap: 8px; align-items: baseline; padding: 5px 0;
    border-bottom: 1px solid var(--line); font-size: 11.5px;
  }
  .row .time { color: var(--muted); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .row .what { flex: 1; font-family: ui-monospace, Consolas, monospace; }
  .row .res { flex: 0 0 auto; font-size: 10px; }
  .res.ok { color: var(--ok); }
  .res.no { color: var(--danger); }
  .res.blocked { color: var(--warn); }

  /* ---- composer ---- */
  footer {
    flex: 0 0 auto; border-top: 1px solid var(--line);
    padding: 9px 12px; display: flex; flex-direction: column; gap: 7px;
  }
  .composer { display: flex; gap: 7px; }
  .composer input {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; color: var(--text);
    font: inherit; outline: none; user-select: text;
  }
  .composer input:focus { border-color: var(--accent-dim); }
  .composer button {
    background: var(--accent-dim); border: 0; color: #041018; font-weight: 600;
    border-radius: 8px; padding: 0 13px; cursor: pointer; font-size: 12px;
  }
  .composer button:hover { background: var(--accent); }
  .hint { font-size: 10.5px; color: var(--muted); display: flex; gap: 10px; }
  .hint b { color: var(--text); font-weight: 500; }
</style>
</head>
<body data-state="starting">

<header>
  <span class="dot starting" id="dot"></span>
  <span class="brand">JARVIS</span>
  <span class="spacer"></span>
  <button id="pin" class="on" title="Always on top">📌</button>
  <button id="log" title="Open engine log">🗒</button>
  <button id="hide" title="Hide to tray">✕</button>
</header>

<div class="stage">
  <div class="orb" id="orb" title="Click to talk"><div class="core"></div></div>
  <div class="state-label" id="stateLabel">starting…</div>
  <div class="meter"><i id="meter"></i></div>
</div>

<nav>
  <button data-tab="chat" class="active">Conversation</button>
  <button data-tab="skills">Skills</button>
  <button data-tab="activity">Activity</button>
</nav>

<main>
  <section class="panel active" id="chat">
    <div class="empty" id="chatEmpty">
      Say <b>“hey jarvis”</b>, press <kbd id="hotkeyHint">Ctrl+Alt+J</kbd>,<br />
      or type a command below.
    </div>
  </section>
  <section class="panel" id="skills"><div class="empty">Loading skills…</div></section>
  <section class="panel" id="activity"><div class="empty">No activity yet.</div></section>
</main>

<footer>
  <div class="composer">
    <input id="input" placeholder="chrome kholo / what's the battery…" autocomplete="off" />
    <button id="send">Run</button>
  </div>
  <div class="hint">
    <span>Wake word <b>hey jarvis</b></span>
    <span>Hotkey <b id="hotkeyFoot">Ctrl+Alt+J</b></span>
  </div>
</footer>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const chat = $("chat"), chatEmpty = $("chatEmpty");
  let info = null, ws = null, reconnectTimer = null, meterIdle = null;

  const STATE_TEXT = {
    starting: "starting…", idle: "listening for “hey jarvis”",
    listening: "listening…", thinking: "thinking…", acting: "working…",
    speaking: "speaking…", confirming: "waiting for your answer",
    error: "something went wrong",
  };

  function setState(state) {
    document.body.dataset.state = state;
    $("stateLabel").textContent = STATE_TEXT[state] || state;
  }

  function addMessage(kind, who, text, meta) {
    if (chatEmpty) chatEmpty.remove();
    const row = document.createElement("div");
    row.className = `msg ${kind}`;
    const label = document.createElement("div");
    label.className = "who";
    label.textContent = who;
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = text;
    if (meta) {
      const tag = document.createElement("span");
      tag.className = "lang";
      tag.textContent = meta;
      body.appendChild(tag);
    }
    row.append(label, body);
    chat.appendChild(row);
    // Only follow the tail when the user is already at the bottom.
    const main = chat.parentElement;
    const atBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 80;
    if (atBottom) main.scrollTop = main.scrollHeight;
    while (chat.children.length > 200) chat.firstChild.remove();
  }

  function showLevel(value) {
    $("meter").style.width = `${Math.min(100, value * 100)}%`;
    clearTimeout(meterIdle);
    meterIdle = setTimeout(() => ($("meter").style.width = "0%"), 400);
  }

  function handleEvent(ev) {
    switch (ev.type) {
      case "state":      setState(ev.state); break;
      case "level":      showLevel(ev.level || 0); break;
      case "transcript": addMessage("you", "you", ev.text, ev.language); break;
      case "reply":      addMessage("jarvis", "jarvis", ev.text); break;
      case "action":
        addMessage("action", "does", `${ev.skill}(${formatArgs(ev.args)})  ·  ${ev.via}`);
        break;
      case "confirm_request":
        addMessage("confirm", "asks", ev.prompt);
        break;
      case "confirm_result":
        addMessage("confirm", "", ev.approved ? "Approved." : "Cancelled.");
        break;
      case "error":      addMessage("error", "error", ev.message || "unknown error"); break;
    }
    if (ev.type === "action" || ev.type === "confirm_result") loadActivity();
  }

  function formatArgs(args) {
    if (!args || !Object.keys(args).length) return "";
    return Object.entries(args).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ");
  }

  function connect() {
    if (!info) return;
    clearTimeout(reconnectTimer);
    try { ws = new WebSocket(info.ws); } catch { return retry(); }

    ws.onopen = () => { $("dot").className = "dot ready"; loadSkills(); loadActivity(); };
    ws.onmessage = (msg) => {
      try { handleEvent(JSON.parse(msg.data)); } catch { /* ignore bad frames */ }
    };
    ws.onclose = () => { $("dot").className = "dot starting"; retry(); };
    ws.onerror = () => ws && ws.close();
  }

  function retry() {
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 1500);
  }

  async function send(text) {
    const value = text.trim();
    if (!value || !info) return;
    addMessage("you", "you", value);
    $("input").value = "";
    try {
      await fetch(`${info.url}/command`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text: value }),
      });
    } catch (err) {
      addMessage("error", "error", `Engine unreachable: ${err.message}`);
    }
  }

  async function loadSkills() {
    if (!info) return;
    try {
      const data = await (await fetch(`${info.url}/skills`)).json();
      const host = $("skills");
      host.textContent = "";
      for (const [category, list] of Object.entries(data.categories)) {
        const box = document.createElement("div");
        box.className = "cat";
        const title = document.createElement("h3");
        title.textContent = category;
        box.appendChild(title);
        for (const s of list) {
          const row = document.createElement("div");
          row.className = "skill";
          row.title = s.description;
          const risk = document.createElement("span");
          risk.className = `risk ${s.risk}`;
          risk.textContent = s.risk === "safe" ? "auto" : s.risk;
          const example = document.createElement("span");
          example.className = "ex";
          example.textContent = s.examples[0] || s.name;
          row.append(risk, example);
          row.onclick = () => { $("input").value = s.examples[0] || ""; $("input").focus(); };
          box.appendChild(row);
        }
        host.appendChild(box);
      }
    } catch { /* the reconnect loop will retry */ }
  }

  async function loadActivity() {
    if (!info) return;
    try {
      const data = await (await fetch(`${info.url}/audit?limit=80`)).json();
      const host = $("activity");
      host.textContent = "";
      if (!data.entries.length) {
        host.innerHTML = '<div class="empty">No activity yet.</div>';
        return;
      }
      for (const e of data.entries) {
        const row = document.createElement("div");
        row.className = "row";
        const time = document.createElement("span");
        time.className = "time";
        time.textContent = (e.iso || "").slice(11, 16);
        const what = document.createElement("span");
        what.className = "what";
        what.textContent = `${e.action}(${formatArgs(e.args)})`;
        const res = document.createElement("span");
        if (!e.allowed) { res.className = "res blocked"; res.textContent = "blocked"; }
        else if (e.ok) { res.className = "res ok"; res.textContent = "ok"; }
        else { res.className = "res no"; res.textContent = "failed"; }
        row.append(time, what, res);
        row.title = e.detail || "";
        host.appendChild(row);
      }
    } catch { /* the reconnect loop will retry */ }
  }

  // ---- wiring ----
  document.querySelectorAll("nav button").forEach((btn) => {
    btn.onclick = () => {
      document.querySelectorAll("nav button").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
      btn.classList.add("active");
      $(btn.dataset.tab).classList.add("active");
      if (btn.dataset.tab === "activity") loadActivity();
    };
  });

  $("send").onclick = () => send($("input").value);
  $("input").onkeydown = (e) => { if (e.key === "Enter") send($("input").value); };
  $("orb").onclick = () => window.jarvis.listen();
  $("hide").onclick = () => window.jarvis.hide();
  $("log").onclick = () => window.jarvis.openLog();

  let pinned = true;
  $("pin").onclick = async () => {
    pinned = !pinned;
    await window.jarvis.pin(pinned);
    $("pin").classList.toggle("on", pinned);
  };

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") window.jarvis.hide();
  });

  window.jarvis.onStatus((payload) => {
    if (payload.state === "ready") { $("dot").className = "dot ready"; connect(); }
    else if (payload.state === "failed") {
      $("dot").className = "dot failed";
      setState("error");
      addMessage("error", "error", payload.message || "The engine failed to start.");
    } else {
      $("dot").className = "dot starting";
      setState("starting");
    }
  });
  window.jarvis.onError((message) => addMessage("error", "error", message));

  window.jarvis.info().then((data) => {
    info = data;
    $("hotkeyHint").textContent = data.hotkey;
    $("hotkeyFoot").textContent = data.hotkey;
    connect();
  });
})();
</script>
</body>
</html>
