<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- This page talks to nothing. Everything goes through the preload bridge to
     the main process, so it needs no network permission at all. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:;" />
<title>Sign in to Jarvis</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: #121826;
    --panel-2: #182031;
    --line: #222d42;
    --text: #e6ecf7;
    --muted: #8494b0;
    --accent: #35d6ff;
    --accent-dim: #1b7f99;
    --warn: #ffb340;
    --danger: #ff5f6d;
    --ok: #4ade80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background:
      radial-gradient(120% 70% at 50% -10%, #16324a 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font: 13px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }

  body { display: flex; flex-direction: column; }

  header {
    -webkit-app-region: drag;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; flex: 0 0 auto;
  }
  .brand { font-weight: 600; letter-spacing: .14em; font-size: 11px; color: var(--muted); }
  .spacer { flex: 1; }
  header button {
    -webkit-app-region: no-drag;
    background: none; border: 0; color: var(--muted);
    width: 26px; height: 24px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  header button:hover { background: var(--panel-2); color: var(--text); }

  main {
    flex: 1 1 auto; overflow-y: auto;
    display: flex; align-items: center; justify-content: center;
    padding: 4px 22px 26px;
  }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .card { width: 100%; max-width: 340px; }

  .orb {
    width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 16px;
    background: radial-gradient(circle at 35% 30%, #2b3d58, #101726 70%);
    border: 1px solid var(--accent-dim);
    display: grid; place-items: center;
    box-shadow: 0 0 26px -8px var(--accent);
  }
  .orb i { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); }

  h1 { font-size: 17px; font-weight: 600; text-align: center; letter-spacing: .01em; }
  .sub {
    color: var(--muted); font-size: 12px; text-align: center;
    margin-top: 6px; margin-bottom: 18px;
  }
  .sub-hi { display: block; margin-top: 3px; font-size: 11.5px; opacity: .82; }

  .tabs {
    display: flex; gap: 3px; margin-bottom: 14px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 3px;
  }
  .tabs button {
    flex: 1; background: none; border: 0; color: var(--muted);
    padding: 7px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px;
  }
  .tabs button.active { background: var(--panel-2); color: var(--text); }

  form { display: flex; flex-direction: column; gap: 10px; }
  label { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: var(--muted); }
  input {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; color: var(--text); font: inherit; outline: none;
    user-select: text;
  }
  input:focus { border-color: var(--accent-dim); }
  input.code {
    letter-spacing: .5em; text-align: center; font-size: 17px;
    font-variant-numeric: tabular-nums;
  }

  button.primary {
    background: var(--accent-dim); border: 0; color: #041018; font-weight: 600;
    border-radius: 8px; padding: 10px; cursor: pointer; font: inherit; font-size: 12.5px;
  }
  button.primary:hover:not(:disabled) { background: var(--accent); }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.secondary {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 9px; cursor: pointer; font: inherit; font-size: 12.5px;
  }
  button.secondary:hover { background: var(--panel-2); }
  button.link {
    background: none; border: 0; color: var(--muted); cursor: pointer;
    font: inherit; font-size: 11.5px; text-decoration: underline; padding: 4px;
  }
  button.link:hover { color: var(--text); }

  .note, .error, .badge {
    border-radius: 8px; padding: 9px 11px; font-size: 11.5px; line-height: 1.5;
  }
  .note { background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
  .error { background: rgba(255,95,109,.12); border: 1px solid #5a2229; color: #ffc3c8; }
  .badge {
    text-align: center; background: rgba(255,179,64,.12);
    border: 1px solid #4a3a19; color: var(--warn);
  }
  .badge.bad { background: rgba(255,95,109,.12); border-color: #5a2229; color: #ffc3c8; }
  .badge.good { background: rgba(74,222,128,.1); border-color: #1f4630; color: var(--ok); }

  .qr {
    background: #fff; border-radius: 10px; padding: 8px; width: 190px;
    margin: 0 auto; line-height: 0;
  }
  .qr svg { width: 100%; height: auto; display: block; }

  details { font-size: 11.5px; color: var(--muted); }
  summary { cursor: pointer; padding: 4px 0; }
  code.key {
    display: block; margin-top: 6px; padding: 8px; user-select: all;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    font-family: ui-monospace, Consolas, monospace; font-size: 11.5px;
    color: var(--text); word-break: break-all;
  }

  .foot { margin-top: 14px; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <span class="brand">JARVIS</span>
  <span class="spacer"></span>
  <button id="hide" title="Hide">🗕</button>
</header>

<main>
  <div class="card">
    <div class="orb"><i></i></div>
    <h1 id="title">Loading…</h1>
    <p class="sub" id="sub"></p>
    <div id="body"></div>
  </div>
</main>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const body = $("body");
  let mode = "login";
  let config = { configured: false, required: true, twoFactor: false };
  let busy = false;

  /* ---- tiny DOM helpers: everything is built, never interpolated ---- */

  const el = (tag, props = {}, children = []) => {
    const node = Object.assign(document.createElement(tag), props);
    for (const child of [].concat(children)) {
      if (child) node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
    }
    return node;
  };

  const field = (labelText, props) => {
    const input = el("input", props);
    return { row: el("label", {}, [labelText, input]), input };
  };

  const errorBox = (message) => el("div", { className: "error", textContent: message });
  const noteBox = (message) => el("div", { className: "note", textContent: message });

  function setHead(title, sub, subHi) {
    $("title").textContent = title;
    const node = $("sub");
    node.textContent = "";
    if (sub) node.appendChild(document.createTextNode(sub));
    if (subHi) node.appendChild(el("span", { className: "sub-hi", textContent: subHi }));
  }

  /** Wraps an async action: disables the form, shows whatever went wrong. */
  function guard(button, action) {
    return async (event) => {
      if (event) event.preventDefault();
      if (busy) return;
      busy = true;
      const label = button.textContent;
      button.disabled = true;
      button.textContent = "Please wait…";
      const stale = body.querySelector(".error");
      if (stale) stale.remove();
      try {
        await action();
      } catch (err) {
        const box = errorBox(err && err.message ? cleanError(err.message) : "Something went wrong.");
        body.insertBefore(box, body.firstChild);
      } finally {
        busy = false;
        button.disabled = false;
        button.textContent = label;
      }
    };
  }

  /** Electron prefixes IPC errors with the handler's location; drop that. */
  function cleanError(message) {
    return String(message).replace(/^Error invoking remote method '[^']+':\s*(Error:\s*)?/, "");
  }

  /* ---- screens ---- */

  function renderSignIn() {
    setHead(
      mode === "login" ? "Welcome back" : "Create your account",
      mode === "login"
        ? "Jarvis stays deaf until you sign in."
        : "You'll verify your email, then an administrator approves the account.",
      mode === "login"
        ? "साइन इन करने तक Jarvis सुनना शुरू नहीं करेगा।"
        : "पहले ईमेल वेरिफ़ाई होगा, फिर एडमिन अकाउंट अप्रूव करेंगे।"
    );

    const tabs = el("div", { className: "tabs" }, [
      el("button", {
        className: mode === "login" ? "active" : "",
        textContent: "Sign in",
        onclick: () => { mode = "login"; renderSignIn(); },
      }),
      el("button", {
        className: mode === "signup" ? "active" : "",
        textContent: "Sign up",
        onclick: () => { mode = "signup"; renderSignIn(); },
      }),
    ]);

    const email = field("Email", { type: "email", autocomplete: "email", required: true });
    const password = field("Password", {
      type: "password",
      autocomplete: mode === "login" ? "current-password" : "new-password",
      required: true,
      minLength: 6,
    });
    const confirm = field("Confirm password", {
      type: "password", autocomplete: "new-password", required: true,
    });

    const submit = el("button", {
      className: "primary",
      textContent: mode === "login" ? "Sign in" : "Create account",
    });

    const form = el("form", {}, [
      email.row,
      password.row,
      ...(mode === "signup" ? [confirm.row] : []),
      submit,
    ]);

    form.onsubmit = guard(submit, async () => {
      if (mode === "signup" && password.input.value !== confirm.input.value) {
        throw new Error("Those passwords don't match.");
      }
      const action = mode === "signup" ? window.auth.signUp : window.auth.signIn;
      render(await action(email.input.value, password.input.value));
    });

    const forgot = el("button", { className: "link", textContent: "Forgot your password?" });
    forgot.onclick = guard(forgot, async () => {
      if (!email.input.value.trim()) throw new Error("Enter your email address first.");
      await window.auth.resetPassword(email.input.value);
      body.insertBefore(noteBox("Reset link sent — check your inbox."), body.firstChild);
    });

    body.replaceChildren(tabs, form, el("div", { className: "foot" }, [forgot]));
    email.input.focus();
  }

  function renderVerify(status) {
    setHead(
      "Verify your email",
      `We sent a link to ${status.email || "your email"}. Open it, then come back.`,
      "ईमेल में भेजे गए लिंक को खोलिए, फिर यहाँ वापस आइए।"
    );

    const check = el("button", { className: "primary", textContent: "I've verified — continue" });
    check.onclick = guard(check, async () => {
      const next = await window.auth.recheck();
      if (next.state === "needs-verification") {
        body.insertBefore(noteBox("Still not verified. Open the link, then try again."), body.firstChild);
      } else {
        render(next);
      }
    });

    const resend = el("button", { className: "secondary", textContent: "Resend the email" });
    resend.onclick = guard(resend, async () => {
      await window.auth.resendVerification();
      body.insertBefore(noteBox("Verification email sent."), body.firstChild);
    });

    body.replaceChildren(el("form", {}, [check, resend]), signOutFoot());
  }

  function renderApproval(status) {
    setHead(
      "Waiting for approval",
      `${status.email || "This account"} has asked for access. An administrator ` +
        "approves it from the AI Calculator's “Manage access” dashboard, which " +
        "shares this Firebase project.",
      "एडमिन की मंज़ूरी का इंतज़ार है।"
    );

    const badge = el("div", { className: "badge", textContent: "⏳ Pending admin approval" });
    const again = el("button", { className: "primary", textContent: "Check again" });
    again.onclick = guard(again, async () => {
      const next = await window.auth.recheck();
      if (next.state === "needs-approval") {
        body.insertBefore(noteBox("Still pending — you'll be let in the moment it's granted."), body.firstChild);
      } else {
        render(next);
      }
    });

    body.replaceChildren(badge, el("form", {}, [again]), signOutFoot());

    // Poll, so the screen advances on its own once the admin acts.
    clearInterval(window.__pollTimer);
    window.__pollTimer = setInterval(async () => {
      if (busy) return;
      const next = await window.auth.recheck();
      if (next.state !== "needs-approval") render(next);
    }, 8000);
  }

  function renderRejected(status) {
    setHead(
      "Access not granted",
      `The administrator has not granted access${status.email ? ` for ${status.email}` : ""}.`,
      "एडमिन ने अभी तक अनुमति नहीं दी है।"
    );
    body.replaceChildren(
      el("div", { className: "badge bad", textContent: "🚫 Access denied" }),
      signOutFoot()
    );
  }

  function renderCodeChallenge(status) {
    setHead(
      "Two-step verification",
      "Enter the 6-digit code from your authenticator app.",
      "अपने ऑथेंटिकेटर ऐप का 6 अंकों का कोड डालिए।"
    );

    const code = field("6-digit code", {
      className: "code", inputMode: "numeric", autocomplete: "one-time-code",
      placeholder: "······", maxLength: 8,
    });
    const submit = el("button", { className: "primary", textContent: "Verify & sign in" });
    const form = el("form", {}, [code.row, submit]);
    form.onsubmit = guard(submit, async () => {
      render(await window.auth.submitCode(code.input.value));
    });

    body.replaceChildren(form, signOutFoot("Cancel"));
    code.input.focus();
  }

  async function renderEnroll() {
    setHead(
      "Set up two-step verification",
      "Scan this with an authenticator app (Google Authenticator, Authy, 1Password), " +
        "then enter the code it shows.",
      "ऑथेंटिकेटर ऐप से स्कैन कीजिए, फिर उसका कोड डालिए।"
    );
    body.replaceChildren(noteBox("Preparing your secure key…"));

    let enrollment;
    try {
      enrollment = await window.auth.beginTotp();
    } catch (err) {
      const retry = el("button", { className: "secondary", textContent: "Try again" });
      retry.onclick = () => void renderEnroll();
      body.replaceChildren(errorBox(cleanError(err.message)), retry, signOutFoot());
      return;
    }

    const parts = [];
    if (enrollment.qrSvg) {
      const qr = el("div", { className: "qr" });
      // Trusted content: this SVG was generated in our own main process from
      // our own string, and this page's CSP forbids loading anything external.
      qr.innerHTML = enrollment.qrSvg;
      parts.push(qr);
    }

    const details = el("details", {}, [
      el("summary", { textContent: enrollment.qrSvg ? "Can't scan it? Enter the key by hand" : "Setup key" }),
      el("code", { className: "key", textContent: enrollment.sharedSecretKey }),
    ]);
    if (!enrollment.qrSvg) details.open = true;
    parts.push(details);

    const code = field("6-digit code", {
      className: "code", inputMode: "numeric", autocomplete: "one-time-code",
      placeholder: "······", maxLength: 8,
    });
    const submit = el("button", { className: "primary", textContent: "Turn on two-step verification" });
    const form = el("form", {}, [code.row, submit]);
    form.onsubmit = guard(submit, async () => {
      render(await window.auth.submitCode(code.input.value));
    });

    body.replaceChildren(...parts, form, signOutFoot());
    code.input.focus();
  }

  function renderOfflineExpired() {
    setHead(
      "Can't reach Firebase",
      "Jarvis re-checks your account every week, and it hasn't been able to. " +
        "Connect to the internet and try again.",
      "इंटरनेट से जुड़िए और दोबारा कोशिश कीजिए।"
    );
    const again = el("button", { className: "primary", textContent: "Try again" });
    again.onclick = guard(again, async () => render(await window.auth.recheck()));
    body.replaceChildren(el("form", {}, [again]), signOutFoot());
  }

  function renderUnconfigured() {
    setHead(
      "Sign-in isn't configured",
      "Jarvis will run without an account. To turn the security layer on, add " +
        "your Firebase keys to desktop\\.env.",
      "बिना अकाउंट के चलेगा। सुरक्षा चालू करने के लिए Firebase keys डालिए।"
    );
    const go = el("button", { className: "primary", textContent: "Continue to Jarvis" });
    go.onclick = () => window.location.replace("index.html");
    body.replaceChildren(
      el("div", { className: "badge", textContent: "🔓 Running unlocked" }),
      el("form", {}, [go])
    );
  }

  function signOutFoot(label) {
    const out = el("button", { className: "link", textContent: label || "Sign out" });
    out.onclick = guard(out, async () => render(await window.auth.signOut()));
    return el("div", { className: "foot" }, [out]);
  }

  /* ---- the router ---- */

  function render(status) {
    if (status.state !== "needs-approval") clearInterval(window.__pollTimer);
    switch (status.state) {
      case "unconfigured": return renderUnconfigured();
      case "signed-out": return renderSignIn();
      case "needs-verification": return renderVerify(status);
      case "needs-approval": return renderApproval(status);
      case "rejected": return renderRejected(status);
      case "offline-expired": return renderOfflineExpired();
      case "needs-2fa":
        return status.codeReason === "enroll" ? void renderEnroll() : renderCodeChallenge(status);
      case "ready":
        // The main process swaps the page as soon as the gate opens; this is
        // only what the user sees for the instant in between.
        return setHead("Signed in", "Starting Jarvis…", "Jarvis शुरू हो रहा है…");
      default:
        return setHead("Loading…", "");
    }
  }

  $("hide").onclick = () => window.jarvis.hide();
  window.auth.onChange(render);

  (async () => {
    config = await window.auth.config();
    render(await window.auth.status());
  })();
})();
</script>
</body>
</html>
