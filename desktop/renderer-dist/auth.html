<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      script-src is 'self', not 'unsafe-inline'. A Vite build emits external
      module scripts, which the old inline-only policy forbade — so this is both
      required and strictly safer than what it replaces. style-src keeps
      'unsafe-inline' because React sets style attributes for the level meter
      and the orb ring.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;"
    />
    <meta name="color-scheme" content="dark light" />
    <title>Sign in to Jarvis</title>
    <script type="module" crossorigin src="./assets/auth-BYbKjCns.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/theme-D2jukYiC.js">
    <link rel="stylesheet" crossorigin href="./assets/theme-DX4at7Lg.css">
    <link rel="stylesheet" crossorigin href="./assets/auth-DVbg4B5b.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
