# JARVIS engine configuration.
# Copy to config.yaml and edit. Every value here is the built-in default,
# so an empty config.yaml behaves identically to this file.

audio:
  # null = pick automatically, skipping virtual inputs (DroidCam, Stereo Mix,
  # VB-Audio and friends) that Windows sometimes makes the system default.
  # To pin one, use `--list-devices` and set an index or a name substring.
  input_device: null
  output_device: null
  sample_rate: 16000
  block_size: 512          # 32 ms frames; consumers re-window as they need

wake_word:
  enabled: true
  model: hey_jarvis        # openWakeWord pretrained: hey_jarvis, alexa, hey_mycroft
  # Measured across 20 synthesised "hey jarvis" clips in four gain/noise
  # conditions: 0.50 missed 22% of them, 0.30 misses 9%, and every miss came
  # from an accented voice (the en-US and en-GB clips never fell below 0.98).
  # Nothing but the bare word "jarvis" scores above 0.30 by accident, so the
  # cost of being this sensitive is that "jarvis" alone may wake it.
  # Run `python -m jarvis --tune-wake-word` to measure your own voice.
  threshold: 0.3
  cooldown_sec: 2.0        # ignore re-triggers for this long after a detection
  # What you hear when the wake word fires, so you know you were heard rather
  # than saying it again. voice = a short spoken "Yes?" / "जी?" in the language
  # of the last turn; chime = a 140 ms rising blip, instant and never overlaps
  # your next words; none = silence.
  acknowledge: voice       # voice | chime | none

vad:
  backend: silero          # silero | energy
  threshold: 0.5           # silero speech probability
  silence_ms: 650          # end the utterance after this much trailing silence
  # Used instead of silence_ms while barely any speech has happened yet — a
  # pause between "chrome" and "kholo" must not end the turn, because half a
  # command routes to nothing and you end up saying the whole thing again.
  patience_silence_ms: 1300
  min_speech_ms: 200       # ignore blips shorter than this
  max_utterance_sec: 15    # hard cap so a stuck mic can't record forever
  preroll_ms: 600          # audio kept from *before* speech started
  no_speech_timeout_sec: 6 # how long to wait for you to start talking

stt:
  backend: local           # local | cloud
  # Two local tiers. Every utterance is decoded by `model` first; only the
  # ones that come back unsure — or whose words matched no skill — are
  # re-decoded by `accurate_model` from the same recording. That way common
  # commands stay fast and the hard ones stop needing a second attempt.
  model: base              # tiny | base | small | medium  (the fast pass)
  accurate_model: small    # the second opinion; set to "" to turn it off
  escalate: true
  min_confidence: 0.62     # below this the fast pass is re-checked
  compute_type: int8       # int8 is ~4x faster than float32 on this CPU
  language: null           # null = auto-detect per utterance (needed for Hinglish)
  beam_size: 3             # 1 = greedy = fastest; the accurate pass always uses 5
  best_of: 3
  # More threads measured *slower* here (16 threads ~40% worse than 4).
  cpu_threads: 4

tts:
  backend: edge            # edge | sapi | none
  # Voices are chosen by the language of your command, not by a fixed setting.
  voice_hi: hi-IN-MadhurNeural
  voice_en: en-IN-NeerjaNeural
  rate: "+10%"
  volume: "+0%"
  barge_in: true           # saying the wake word mid-reply cuts the speech off

brain:
  enabled: true
  # Which AI provider and model to start with. The settings screen in the app
  # overrides both — these are only the defaults for a fresh install or a bare
  # `python -m jarvis`. Leave `model` empty for that provider's own default,
  # so switching provider doesn't mean editing two lines.
  #   anthropic | openai | gemini | groq | deepseek | mistral
  provider: anthropic
  model: ""
  # Effort trades latency for depth. "low" keeps spoken replies snappy;
  # thinking stays ON deliberately — with it disabled this model can emit a
  # tool call as plain text, which would silently never execute.
  effort: low
  # Headroom for thinking + the reply, since both count against this budget.
  max_tokens: 2048
  # Fuzzy-match confidence below which we escalate to the model. Higher = more
  # traffic to the model (smarter, slower, costs money); lower = more commands
  # recovered offline. Garbled-but-recoverable Hinglish measured 70-77 here.
  rules_threshold: 70
  history_turns: 6         # conversation turns kept for context

permissions:
  # Ask before running CONFIRM-tier skills (sleep, lock, close app).
  confirm_tier_enabled: true
  # CRITICAL-tier (shutdown, restart, delete, send message) always confirms.
  # Set to true only if you really want unattended shutdowns.
  allow_critical_without_confirm: false
  confirm_timeout_sec: 12

security:
  # Refuse to open the microphone until someone has signed in. The desktop app
  # turns this on for its own launches (JARVIS_REQUIRE_SESSION=1); leaving it
  # false here keeps `python -m jarvis` usable from a terminal.
  require_session: false

server:
  host: 127.0.0.1          # loopback only — the API can shut the machine down
  port: 8756               # WebSocket + HTTP for the Electron HUD

assistant:
  name: Jarvis
  # Language for replies when detection is ambiguous: hi | en | auto
  default_reply_language: auto
  # Seconds to keep listening after a reply, so a follow-up or a correction
  # needs no wake word. 0 disables it.
  followup_sec: 6
